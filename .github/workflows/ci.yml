name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocksync
          POSTGRES_PASSWORD: stocksync
          POSTGRES_DB: stocksync
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U stocksync -d stocksync"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbit:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: stocksync
          RABBITMQ_DEFAULT_PASS: stocksync
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOCKSYNC_DATABASE_URL: postgresql+asyncpg://stocksync:stocksync@localhost:5434/stocksync
      # Брокер поднимается по-настоящему: тесты связки с заглушкой проверяли бы
      # только то, что вызван publish, и молчали бы о подтверждениях и повторах.
      STOCKSYNC_RABBIT_URL: amqp://stocksync:stocksync@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Линтер
        run: ruff check app tests scripts
      - name: Миграции накатываются и откатываются
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Тесты
        run: python -m pytest
      - name: Схема OpenAPI собирается
        run: python -c "from app.main import app; import json; print(len(json.dumps(app.openapi())))"
